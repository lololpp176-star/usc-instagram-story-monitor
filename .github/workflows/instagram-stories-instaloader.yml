name: Instagram Stories via Instaloader

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose what to run"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - test-discord
  schedule:
    # GitHub's shortest supported schedule interval is 5 minutes.
    # Offset from the top of the hour to reduce scheduler congestion.
    - cron: "3-58/5 * * * *"

permissions:
  contents: write

concurrency:
  group: instagram-story-monitor-instaloader
  cancel-in-progress: true

jobs:
  check-stories:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r instagram-story-discord-free/requirements-instaloader.txt

      - name: Restore Instagram session
        env:
          INSTAGRAM_SESSION_B64: ${{ secrets.INSTAGRAM_SESSION_B64 }}
        run: |
          test -n "$INSTAGRAM_SESSION_B64"
          printf '%s' "$INSTAGRAM_SESSION_B64" | base64 --decode > "$RUNNER_TEMP/instagram-session"
          chmod 600 "$RUNNER_TEMP/instagram-session"
          echo "IG_SESSION_FILE=$RUNNER_TEMP/instagram-session" >> "$GITHUB_ENV"

      - name: Check Instagram Stories
        env:
          IG_USERNAME: botwatch92848
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CASA_DISCORD_WEBHOOK_URL: ${{ secrets.CASA_DISCORD_WEBHOOK_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TEST_DISCORD_ONLY: ${{ github.event.inputs.mode == 'test-discord' }}
        run: python -u instagram-story-discord-free/instaloader_story_monitor.py

      - name: Save Story history and profile IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f instagram-story-discord-free/seen_instagram_stories_instaloader.json ]; then
            git add instagram-story-discord-free/seen_instagram_stories_instaloader.json
          fi

          if [ -f instagram-story-discord-free/instagram_profile_ids.json ]; then
            git add instagram-story-discord-free/instagram_profile_ids.json
          fi

          if git diff --cached --quiet; then
            echo "No monitor-state changes to save."
          else
            git commit -m "Update Instaloader Story monitor state"
            git push
          fi
