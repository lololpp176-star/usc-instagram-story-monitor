name: Instagram Stories — Mobile Batch Probe v2

on:
  push:
    paths:
      - .github/workflows/instagram-stories-instaloader.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "single-check baselines all accounts; normal runs the monitor"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - single-check

permissions:
  contents: write

concurrency:
  group: instagram-story-monitor-batched
  cancel-in-progress: false

jobs:
  check-stories:
    if: github.event_name == 'push' || inputs.mode == 'single-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r instagram-story-discord-free/requirements-mobile-probe.txt

      - name: Check all monitored Stories in one batch
        timeout-minutes: 4
        env:
          INSTAGRAM_SESSIONID: ${{ secrets.INSTAGRAM_SESSIONID }}
        run: python -u instagram-story-discord-free/instagram_mobile_batch_probe.py

      - name: Save Story state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram-story-discord-free/seen_instagram_stories_instaloader.json
          if ! git diff --cached --quiet; then
            git commit -m "Update batched Story monitor state"
            git push origin HEAD:main
          fi
