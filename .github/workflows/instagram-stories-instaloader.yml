name: Instagram Stories via Instaloader

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "single-check runs one bounded experiment; normal obeys the automatic enable flag"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - single-check

permissions:
  contents: write

concurrency:
  group: instagram-story-monitor-instaloader
  cancel-in-progress: false

jobs:
  check-stories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reserve one check
        id: gate
        env:
          MONITOR_MODE: ${{ inputs.mode }}
        run: python instagram-story-discord-free/experiment_control.py prepare

      - name: Persist pause before contacting Instagram
        if: steps.gate.outputs.allowed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram-story-discord-free/monitor_control.json
          git commit -m "Reserve bounded Instagram check"
          git push origin HEAD:main

      - name: Install requirements
        if: steps.gate.outputs.allowed == 'true'
        run: python -m pip install -r instagram-story-discord-free/requirements-instaloader.txt

      - name: Restore existing Instagram session
        if: steps.gate.outputs.allowed == 'true'
        env:
          INSTAGRAM_SESSION_B64: ${{ secrets.INSTAGRAM_SESSION_B64 }}
        run: |
          test -n "$INSTAGRAM_SESSION_B64"
          printf '%s' "$INSTAGRAM_SESSION_B64" | base64 --decode > "$RUNNER_TEMP/instagram-session"
          chmod 600 "$RUNNER_TEMP/instagram-session"
          echo "IG_SESSION_FILE=$RUNNER_TEMP/instagram-session" >> "$GITHUB_ENV"

      - name: Check Instagram Stories once
        if: steps.gate.outputs.allowed == 'true'
        id: check
        timeout-minutes: 4
        env:
          IG_USERNAME: botwatch92848
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CASA_DISCORD_WEBHOOK_URL: ${{ secrets.CASA_DISCORD_WEBHOOK_URL }}
        run: python -u instagram-story-discord-free/instaloader_story_monitor.py

      - name: Record outcome and save state
        if: always() && steps.gate.outputs.allowed == 'true'
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          python instagram-story-discord-free/experiment_control.py finish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram-story-discord-free/monitor_control.json
          git add instagram-story-discord-free/seen_instagram_stories_instaloader.json
          git add instagram-story-discord-free/instagram_profile_ids.json
          if ! git diff --cached --quiet; then
            git commit -m "Record bounded Instagram check outcome"
            git push origin HEAD:main
          fi

      - name: Remove temporary session
        if: always()
        run: rm -f "$RUNNER_TEMP/instagram-session"
