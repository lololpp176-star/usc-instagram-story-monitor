name: Instagram Stories via Free Public Viewer

on:
  push:
    paths:
      - .github/workflows/instagram-stories-instaloader.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "single-check baselines one account; normal checks the current cohort"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - single-check

permissions:
  contents: write

concurrency:
  group: instagram-story-monitor-public-viewer
  cancel-in-progress: false

jobs:
  check-stories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r instagram-story-discord-free/requirements-igexport.txt

      - name: Verify browser
        run: |
          google-chrome --version
          chromedriver --version

      - name: Check public Instagram Stories
        id: check
        timeout-minutes: 7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CASA_DISCORD_WEBHOOK_URL: ${{ secrets.CASA_DISCORD_WEBHOOK_URL }}
          MONITOR_ONLY: ${{ github.event_name == 'push' && 'usccasa' || (inputs.mode == 'single-check' && 'usccasa' || '') }}
          BASELINE_ONLY: ${{ github.event_name == 'push' && 'true' || (inputs.mode == 'single-check' && 'true' || 'false') }}
        run: python -u instagram-story-discord-free/igexport_story_monitor.py

      - name: Save Story state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram-story-discord-free/seen_instagram_stories_instaloader.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public Story monitor state"
            git push origin HEAD:main
          fi
